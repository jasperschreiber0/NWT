name: NWT CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nwt_test
          POSTGRES_PASSWORD: nwt_test
          POSTGRES_DB: nwt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nwt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NWT_TEST_DB_DSN: postgresql://nwt_test:nwt_test@localhost:5432/nwt_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f nwt_agents/requirements.txt ]; then python -m pip install -r nwt_agents/requirements.txt; fi
          if [ -f execution/requirements.txt ]; then python -m pip install -r execution/requirements.txt; fi

      - name: Compile production Python
        run: |
          python -m compileall -q \
            asx china dashboard execution master nwt_agents performance ukeu us ops research

      - name: Verify focused execution tests collect independently
        run: >-
          python -m pytest -q
          execution/tests/test_engine_shortability_gate.py
          execution/tests/test_experiment_budget.py
          execution/tests/test_paper_workflow.py

      - name: Run offline and unit tests
        run: python -m pytest -q tests_offline nwt_agents/tests execution/tests ukeu/tests ops research

      - name: Validate migrations are present
        run: |
          test -f db/schema.sql
          test -f db/migrate_2026_09_opportunity_outcomes.sql

      - name: Verify opportunity migration applies repeatedly
        run: |
          psql "$NWT_TEST_DB_DSN" -v ON_ERROR_STOP=1 -f db/migrate_2026_09_opportunity_outcomes.sql
          psql "$NWT_TEST_DB_DSN" -v ON_ERROR_STOP=1 -f db/migrate_2026_09_opportunity_outcomes.sql

